<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Force Pure</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <div class="app">
      <section id="mode-screen" class="screen is-active">
        <h1 class="title">Force Pure</h1>
        <div class="mode-buttons">
          <button class="mode-button mode-countdown" id="mode-countdown">COUNTDOWN</button>
          <button class="mode-button mode-interval" id="mode-interval">INTERVAL</button>
          <button class="mode-button mode-4x4" id="mode-4x4">NORWEGIAN 4×4</button>
        </div>
      </section>

      <section id="setup-screen" class="screen">
        <button class="back-button" id="countdown-back" aria-label="Back">‹</button>
        <h1 class="title">Countdown</h1>
        <div class="duration-display" id="duration-display">05:00</div>
        <button class="start-button" id="start-button">START</button>
      </section>

      <section id="interval-setup-screen" class="screen">
        <button class="back-button" id="interval-back" aria-label="Back">‹</button>
        <h1 class="title">Interval</h1>
        <div class="interval-config">
          <div class="config-row">
            <span class="config-label">WORK</span>
            <button class="config-value" id="interval-work">04:00</button>
          </div>
          <div class="config-row">
            <span class="config-label">REST</span>
            <button class="config-value" id="interval-rest">03:00</button>
          </div>
          <div class="config-row">
            <span class="config-label">ROUNDS</span>
            <div class="stepper">
              <button class="stepper-button" id="rounds-minus" aria-label="Fewer rounds">−</button>
              <span class="stepper-value" id="rounds-value">4</span>
              <button class="stepper-button" id="rounds-plus" aria-label="More rounds">+</button>
            </div>
          </div>
        </div>
        <button class="start-button" id="interval-start">START</button>
      </section>

      <section id="running-screen" class="screen">
        <button class="back-button" id="back-button" aria-label="Back">‹</button>
        <div class="running-subtitle" id="running-subtitle"></div>
        <div class="running-display" id="running-display">05:00</div>
      </section>

      <section id="finished-screen" class="screen">
        <div class="finished-emoji">💪</div>
        <div class="finished-message">Nice work!</div>
        <div class="finished-duration" id="finished-duration">05:00 completed</div>
        <button class="start-button" id="done-button">DONE</button>
      </section>
    </div>

    <div class="picker" id="duration-picker">
      <div class="picker-sheet">
        <ul class="picker-list" id="picker-list"></ul>
        <button class="picker-ok" id="picker-ok">OK</button>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
